##########
# SERVER #
##########

HOSTNAME: localhost

APP_DEBUG: false
# httpx debug mode is very verbose, so the setting is separate from the main app debug mode
HTTPX_DEBUG: false

# For deployments that run the app behind a proxy. The value should start with a slash.
PROXY_PREFIX:

# override the default Arborist URL; ignored if already set as an environment variable
ARBORIST_URL:

# /!\ only use for development! Allows running gen3workflow locally without Arborist interaction
MOCK_AUTH: false

# How long to cache user bucket information for. Defaults to 12 hours. Has to be at least 1 second
# (does not allow 0 which means no expiration).
USER_BUCKET_CACHE_SECONDS: 43200

# /!\ WARNING: Changing this would involve coordinating a change in task token config in the auth service (e.g. Fence).
# This is because the auth service needs to know what audience to use when issuing task tokens, and the workflow service needs to know what audience to expect when validating task tokens.
VALID_AUTHZ_AUDIENCE:
  - "WORKFLOW"
  # TODO: remove "user" - it's a workaround to accept old-fence tokens that do not have
  # the updated aud and that are not aud-validated
  - "user"
  - "gen3"

###################
# DPoP (RFC 9449) #
###################

# When true, DPoP-bound access tokens presented to the GA4GH TES and S3 endpoints must come
# with a valid DPoP proof. Tokens that are not DPoP-bound (no `cnf.jkt` claim) are unaffected,
# so worker pods using the `client_credentials` flow keep working.
DPOP_ENABLED: false

# When true, the DPoP-protected endpoints reject any request that does not present a DPoP-bound
# access token along with a valid proof. Requires `DPOP_ENABLED`.
# The clients listed in `DPOP_EXEMPT_CLIENT_IDS` are the only exception.
DPOP_REQUIRED: false

# Client IDs whose `client_credentials` tokens are accepted by the DPoP-protected endpoints
# without a DPoP proof when `DPOP_REQUIRED` is true, such as the Funnel worker pods' client.
# Those tokens are never DPoP-bound, so their holders have no key to sign a proof with. A client
# that is not listed here is held to the same requirement as a user.
# /!\ WARNING: an exempt token is an ordinary bearer credential: whoever holds it can act as any
# user the client is authorized for, and `DPOP_REQUIRED` does not change that. Keep this list to
# the clients that need it, and their Arborist policies as narrow as the workflows allow.
DPOP_EXEMPT_CLIENT_IDS: []

# Secret used to sign and verify the stateless DPoP nonces.
# /!\ WARNING: this MUST be the exact same value as the `DPOP_SHARED_SECRET` of the auth
# service (e.g. Fence) that issues the DPoP-bound tokens. Clients reuse the nonce Fence
# handed them for their first request here, and a nonce signed with a different secret does
# not verify. The `DPOP_SHARED_SECRET` environment variable takes precedence over this.
DPOP_SHARED_SECRET:

# Token issuers allowed to sign DPoP-bound access tokens. Defaults to
# "https://<HOSTNAME>/user", which is where Gen3 serves the auth service, so this only needs
# to be set when the tokens come from somewhere else.
DPOP_ALLOWED_ISSUERS: []

# Origin of this service as the client sees it, used to rebuild the URL the client signed in
# the proof's `htu` claim. Defaults to "https://<HOSTNAME>".
DPOP_EXTERNAL_BASE_URL:

# Maps the path prefix of each DPoP-protected group of endpoints, as this service sees it, to
# the path prefix the reverse proxy exposes it at. The Gen3 reverse proxy strips "/workflows"
# before the request reaches this service, but the client signed the un-stripped URL, so the
# prefix has to be added back before comparing against `htu`.
DPOP_PROTECTED_PATHS:
  /ga4gh/tes: ""
  /s3: /workflows

##########
# AWS S3 #
##########

USER_BUCKETS_REGION: us-east-1

# connect to another S3-compatible service than AWS S3 (default: AWS S3)
S3_UPSTREAM_ENDPOINT:

# objects created in S3 for/by workflows are deleted after the specified number of days
S3_OBJECTS_EXPIRATION_DAYS: 30

# configure an AWS IAM key to use when making S3 requests on behalf of users. If left empty, it
# is assumed there is an existing STS session we can get credentials from.
S3_ENDPOINTS_AWS_ACCESS_KEY_ID:
S3_ENDPOINTS_AWS_SECRET_ACCESS_KEY:

KMS_ENCRYPTION_ENABLED: true

# Set it to true to create S3Files resources (default - false)
# NOTE: Currently Gen3Workflow with S3Files only supports bucket and the EKS cluster being present in the same region.
# Support shall be added in the future.
ENABLE_S3_FILES: false

#############
# GA4GH TES #
#############

TES_SERVER_URL: http://funnel:8000

# List of whitelisted images to be allowed by the Gen3Workflow Service to forward to TES server.
# Image names can contain wildcards with `*` and username as a placeholder within curly braces e.g. {username}
TASK_IMAGE_WHITELIST: []
  # - public.ecr.aws/random/approved/public:*
  # - 9876543210.dkr.ecr.us-east-1.amazonaws.com/approved/{username}:abc
  # - quay.io/nextflow/bash:*

#############
#  METRICS  #
#############

ENABLE_PROMETHEUS_METRICS: false
PROMETHEUS_MULTIPROC_DIR: /var/tmp/prometheus_metrics

###################
#  OBSERVABILITY  #
###################

# Emit OpenTelemetry spans for requests, outbound HTTP calls and AWS calls. Leave the endpoint
# empty to print spans to the console, which is how to inspect them locally without running a
# collector.
ENABLE_TRACING: false
OTEL_EXPORTER_OTLP_ENDPOINT: ""
OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf

# Push profiles to Pyroscope. The address is Pyroscope's own ingest API, not an OTLP
# receiver, so an OTLP port such as 4317 or 4318 fails at push time rather than at startup.
# Basic-auth credentials and the tenant id are read from PYROSCOPE_BASIC_AUTH_USERNAME,
# PYROSCOPE_BASIC_AUTH_PASSWORD and PYROSCOPE_TENANT_ID, so they are never templated into a
# configuration file.
ENABLE_CONTINUOUS_PROFILING: false
PYROSCOPE_SERVER_ADDRESS: ""

# What the Pyroscope agent collects, how many samples per second it takes and how many seconds
# it waits between pushes. All 5 are handed to the agent, so the PROFILE_CPU, PROFILE_MEMORY,
# PROFILE_ON_CPU_ONLY, PYROSCOPE_SAMPLE_RATE and PYROSCOPE_UPLOAD_INTERVAL environment
# variables the profiling library falls back to are not consulted.
# Memory profiling is heavier than CPU profiling, so it is off until something needs it.
# PROFILE_ON_CPU_ONLY measures CPU time rather than wall-clock time, which leaves time spent
# awaiting I/O out of the flamegraph: turn it off to see a request that spends most of its time
# waiting on the TES server or S3.
PROFILE_CPU: true
PROFILE_MEMORY: false
PROFILE_ON_CPU_ONLY: true
PYROSCOPE_SAMPLE_RATE: 100
PYROSCOPE_UPLOAD_INTERVAL: 10

#############
#  CLUSTER  #
#############

# When enabled, jobs are configured to run on specific nodes through Kubernetes NodeSelector
# and Tolerations. Disable this if using a cluster that does not support nodepools.
ENABLE_OPTIMIZED_NODE_SCHEDULING: true

# When Gen3Workflow runs on an EKS cluster, it relies on IAM Roles for Service Accounts (IRSA)
# to provide AWS permissions to Funnel's worker and executor pods.
#
# The parameters below are required for Gen3Workflow to:
#   - Identify the Kubernetes namespace where the worker pods run, to construct
#     the correct IAM role trust relationships
#   - Fetch cluster's OIDC provider URL based on the given cluster name and region
#
# In short: these values allow Gen3Workflow to generate per-user IAM roles that EKS will recognize and associate
# with the corresponding service accounts used by Funnel pods.
EKS_CLUSTER_NAME: ""
EKS_CLUSTER_REGION: us-east-1
WORKER_PODS_NAMESPACE: default-namespace

# Names of the EKS security groups that Karpenter attaches to an EKS worker node in this cluster
# Usually going to be in the lines of f"{config["EKS_CLUSTER_NAME"]}_EKS_workers_sg"
# Steps to fetch the values: https://github.com/uc-cdis/gen3-workflow/blob/master/docs/s3Files.md#determining-the-eks-security-group-names-for-s3-files-setup
EKS_SECURITY_GROUP_NAMES: []
