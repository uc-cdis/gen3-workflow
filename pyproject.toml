[tool.poetry]
name = "gen3workflow"
version = "1.0.0"
description = "Gen3 Workflow Execution Service"
authors = ["CTDS UChicago <cdis@uchicago.edu>"]
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/uc-cdis/gen3workflow"
include = [
  "NOTICE",
]

[tool.poetry.dependencies]
python = ">=3.13,<4"
authutils = {git = "https://github.com/uc-cdis/authutils.git", rev = "feat/dpop"}
boto3 = ">=1"
botocore = "*"
cachelib = "*"
cdislogging = ">=1"
cdispyutils = { git = "https://github.com/uc-cdis/cdis-python-utils.git", rev = "feat/observability", extras = ["observability"] }
fastapi = "<1"
gen3authz = ">=3"
gen3config = ">=2"
httpx = "<1"
jsonschema = "<5"
# Not part of the cdispyutils observability extra: the right database/AWS
# instrumentation differs per service, so each one brings its own.
opentelemetry-instrumentation-botocore = "*"
pyyaml = "*"
uvicorn = "<1"
starlette = "*"

[tool.poetry.group.dev.dependencies]
freezegun = "*"
# used by the tests to generate the keys and tokens of a DPoP flow
joserfc = "*"
moto = "*"
pytest = "*"
pytest-asyncio = "*"
pytest-cov = "*"
deptry = "*"

[build-system]
requires = ["poetry<2"]
build-backend = "poetry.masonry.api"
